name: Build APK GrowTrack

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil sumber
        uses: actions/checkout@v4
      - name: Buka keystore rilis
        env:
          ENC_PASS: ${{ secrets.KEYSTORE_ENC_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in growtrack-release.jks.enc -out "$RUNNER_TEMP/growtrack-release.jks" -pass pass:"$ENC_PASS"
          ls -la "$RUNNER_TEMP/growtrack-release.jks"

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat rangka platform Android
        run: |
          mkdir -p /tmp/rangka
          cp pubspec.yaml /tmp/rangka/
          cp -r lib /tmp/rangka/
          cd /tmp/rangka
          flutter create --org id.kkp --project-name growtrack --platforms=android .
          cp -r android "$GITHUB_WORKSPACE/"
          cp .metadata "$GITHUB_WORKSPACE/" 2>/dev/null || true

      - name: Alihkan unduhan Gradle ke mirror Tencent
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          s = open(p).read()
          m = re.search(r'gradle-([0-9.]+)-all\.zip', s)
          ver = m.group(1) if m else '9.3.1'
          s = re.sub(r'distributionUrl=.*',
                     'distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-' + ver + '-all.zip',
                     s)
          open(p, 'w').write(s)
          print('distributionUrl dialihkan ke mirror Tencent, Gradle', ver)
          PYEOF

      - name: Pasang ikon logo Posyandu
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$dpi
            cp launcher/mipmap-$dpi/ic_launcher.png android/app/src/main/res/mipmap-$dpi/ic_launcher.png
            cp launcher/mipmap-$dpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-$dpi/ic_launcher_foreground.png
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XEOF

      - name: Buat ikon HD dari logo master
        run: |
          python3 -m pip install -q pillow
          python3 - << 'PYEOF'
          from PIL import Image
          src = Image.open('assets/icon/posyandu-logo.png').convert('RGBA')
          dens = {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}
          for nama, f in dens.items():
              dasar = 'android/app/src/main/res/mipmap-' + nama
              sisi = int(48 * f)
              leg = Image.new('RGBA', (sisi, sisi), (255, 255, 255, 255))
              leg.alpha_composite(src.resize((sisi, sisi), Image.LANCZOS))
              leg.convert('RGB').save(dasar + '/ic_launcher.png')
              kanvas = int(108 * f)
              fg = Image.new('RGBA', (kanvas, kanvas), (0, 0, 0, 0))
              t = int(kanvas * 0.68)
              fg.alpha_composite(src.resize((t, t), Image.LANCZOS), ((kanvas - t) // 2, (kanvas - t) // 2))
              fg.save(dasar + '/ic_launcher_foreground.png')
          print('ikon HD selesai dibuat')
          PYEOF
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XEOF

      - name: Pasang label aplikasi
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="GrowTrack"', s)
          open(p, 'w').write(s)
          print('manifest terpasang')
          PYEOF

      - name: Pasang izin internet (untuk sinkronisasi cloud)
        run: |
          python3 - << 'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application',
                            '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                            1)
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application',
                            '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application',
                            1)
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application',
                            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application',
                            1)
          open(p, 'w').write(s)
          print('izin internet terpasang')
          PYEOF

      - name: Aktifkan core library desugaring
        run: |
          python3 - << 'PYEOF'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
            p = kts
            s = open(p).read()
            if 'coreLibraryDesugaring' not in s:
              lines = s.splitlines(True)
              out = []
              for line in lines:
                out.append(line)
                if 'compileOptions {' in line:
                  out.append('        isCoreLibraryDesugaringEnabled = true\n')
              s = ''.join(out)
              if not s.endswith('\n'):
                s += '\n'
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(p, 'w').write(s)
              print('core library desugaring diaktifkan di', p)
            else:
              print('core library desugaring sudah aktif di', p)
          elif os.path.exists(groovy):
            p = groovy
            s = open(p).read()
            if 'coreLibraryDesugaring' not in s:
              lines = s.splitlines(True)
              out = []
              for line in lines:
                out.append(line)
                if 'compileOptions {' in line:
                  out.append('        coreLibraryDesugaringEnabled true\n')
              s = ''.join(out)
              if not s.endswith('\n'):
                s += '\n'
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              open(p, 'w').write(s)
              print('core library desugaring diaktifkan di', p)
            else:
              print('core library desugaring sudah aktif di', p)
          else:
            raise SystemExit('build.gradle.kts atau build.gradle tidak ditemukan di android/app/')
          PYEOF
      - name: Pasang tanda tangan rilis permanen
        env:
          ENC_PASS: ${{ secrets.KEYSTORE_ENC_PASS }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=growtrack\nkeyPassword=%s\n' "$RUNNER_TEMP/growtrack-release.jks" "$ENC_PASS" "$ENC_PASS" > android/key.properties
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          blok = '    signingConfigs {\n        create("rilis") {\n            val kp = java.util.Properties()\n            val kf = rootProject.file("key.properties")\n            if (kf.exists()) {\n                kp.load(java.io.FileInputStream(kf))\n                storeFile = file(kp.getProperty("storeFile"))\n                storePassword = kp.getProperty("storePassword")\n                keyAlias = kp.getProperty("keyAlias")\n                keyPassword = kp.getProperty("keyPassword")\n            }\n        }\n    }\n'
          if 'signingConfigs' not in s:
              s = s.replace('buildTypes {', blok + '    buildTypes {', 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("rilis")')
          open(p, 'w').write(s)
          print('signing rilis terpasang:', 'rilis' in s)
          PY

      - name: Poloskan splash bawaan Android (krem polos, tanpa ikon burik)
        run: |
          for d in drawable drawable-v21; do
            mkdir -p android/app/src/main/res/$d
            cat > android/app/src/main/res/$d/launch_background.xml << 'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#F7F5EF"/>
              </item>
          </layer-list>
          XEOF
          done
          echo 'splash bawaan diganti krem polos'

      - name: Ambil dependensi
        run: flutter pub get

      - name: Build APK release arm64
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
      - name: Ganti nama APK menjadi GrowTrack.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk GrowTrack.apk

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: growtrack-apk
          path: GrowTrack.apk
          if-no-files-found: error

      - name: Baca versi dari pubspec
        id: versi
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/^version: *//')" >> "$GITHUB_OUTPUT"

      - name: Terbitkan APK ke Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versi.outputs.version }}
          name: GrowTrack v${{ steps.versi.outputs.version }}
          body: Pembaruan GrowTrack. Unduh GrowTrack.apk dari rilis ini lalu pasang menimpa versi lama; data tidak hilang.
          files: GrowTrack.apk
          fail_on_unmatched_files: true
