name: growtrack
description: GrowTrack - Sistem Informasi Monitoring Tumbuh Kembang Anak (Posyandu). Konversi Flutter dari GrowTrack desktop.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/posyandu-logo.png
