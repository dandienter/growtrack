name: growtrack
description: GrowTrack - Sistem Informasi Monitoring Tumbuh Kembang Anak (Posyandu). Konversi Flutter dari GrowTrack desktop.
publish_to: 'none'
version: 1.9.0+14

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^13.3.2
  excel: ^4.0.6
  path_provider: ^2.1.0
  open_filex: ^4.7.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  share_plus: ^13.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/posyandu-logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
